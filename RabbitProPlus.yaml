+proxy-groups:
-
  name: 🇯🇵JP
  type: select
  # type: url-test
  interval: 1800
  tolerance: 50
  proxies:
    - '🇯🇵 A0013 日本'
    - "🇯🇵 A0014 日本"
    - '🇯🇵 A0015 日本'
    - '🇯🇵 B1021 日本'
    - '🇯🇵 B1022 日本'
    - '🇯🇵 B1023 日本'
    - '🇯🇵 B1024 日本'
-
  name: 🇺🇸US
  type: select
  # type: url-test
  interval: 1800
  tolerance: 50
  proxies:
    - '🇺🇸 A0016 美国'
    - '🇺🇸 A0017 美国'
    - '🇺🇸 A0018 美国'
    - '🇺🇸 B1013 美国'
    - '🇺🇸 B1014 美国'
    - '🇺🇸 B1015 美国'
    - '🇺🇸 B1016 美国'
